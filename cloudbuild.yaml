  _MAP_MAX_X: "3584"
  _MAP_MIN_Y: "-8064"
  _MAP_MAX_Y: "12032"
  _MAP_CENTER_X: "-6400"
  _MAP_CENTER_Y: "1984"
  _MAP_MAX_ZOOM: "5.5"
  _ADSENSE_CLIENT: "ca-pub-9449600740636411"
  _ADSENSE_SLOT_BANNER: "9174557090"
  _ADSENSE_SLOT_IN_ARTICLE: "2336997643"
  _ADSENSE_UNITS: "true"
  _GA_MEASUREMENT_ID: "G-014MS4346K"
  # Fill via --substitutions when SiteStripe ASINs ready (tag e.g. map6-21)
  _AMAZON_AFFILIATE_TAG: "map6-21"
  _AMAZON_STORE: "https://www.amazon.fr"
  _AMAZON_ASIN_GTA6_PS5: ""
  _AMAZON_ASIN_GTA6_XBOX: ""
  _AMAZON_ASIN_GTA6_COLLECTORS_PS5: ""
  _AMAZON_ASIN_GTA6_COLLECTORS_XBOX: ""
  _AMAZON_ASIN_PS5: "B0FX2VBNMF"
  _AMAZON_ASIN_XBOX_SERIES_X: "B08H93ZRLL"
  _AMAZON_ASIN_DUALSENSE: "B094WLFGD3"
  _AMAZON_ASIN_DUALSENSE_WHITE: "B08H99BPJN"
  _AMAZON_ASIN_XBOX_PAD: "B08SRMPBRF"
  _AMAZON_ASIN_DUALSENSE_EDGE: "B0DSPX3R62"
  _AMAZON_ASIN_PULSE_3D: "B0DSPWT99L"
  _AMAZON_ASIN_ARCTIS_NOVA: "B0D1KCF7L2"
  _AMAZON_ASIN_SSD_1TB: "B0B7CKZGN6"
  _AMAZON_ASIN_CAPTURE_CARD: "B09V1KJ3J4"
  _AMAZON_ASIN_CHARGE_DOCK: "B08S3FMVV7"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_GTADB_ENABLED=${_GTADB_ENABLED}
      - --build-arg
      - NEXT_PUBLIC_GTADB_NATIVE=${_GTADB_NATIVE}
      - --build-arg
      - NEXT_PUBLIC_GTADB_MAP_IMAGE=${_GTADB_MAP_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_GTA5_GTADB_ENABLED=${_GTA5_GTADB_ENABLED}
      - --build-arg
      - NEXT_PUBLIC_GTA5_GTADB_NATIVE=${_GTA5_GTADB_NATIVE}
      - --build-arg
      - NEXT_PUBLIC_GTA5_GTADB_MAP_IMAGE=${_GTA5_GTADB_MAP_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_GTA5_MAP_MIN_X=${_GTA5_MAP_MIN_X}
      - --build-arg
      - NEXT_PUBLIC_GTA5_MAP_MAX_X=${_GTA5_MAP_MAX_X}
      - --build-arg
      - NEXT_PUBLIC_GTA5_MAP_MIN_Y=${_GTA5_MAP_MIN_Y}
      - --build-arg
      - NEXT_PUBLIC_GTA5_MAP_MAX_Y=${_GTA5_MAP_MAX_Y}
      - --build-arg
      - NEXT_PUBLIC_GTA5_MAP_CENTER_X=${_GTA5_MAP_CENTER_X}
      - --build-arg
      - NEXT_PUBLIC_GTA5_MAP_CENTER_Y=${_GTA5_MAP_CENTER_Y}
      - --build-arg
      - NEXT_PUBLIC_GTA5_MAP_MAX_ZOOM=${_GTA5_MAP_MAX_ZOOM}
      - --build-arg
      - NEXT_PUBLIC_VC_MAP_IMAGE=${_VC_MAP_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_SA_MAP_IMAGE=${_SA_MAP_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_MAP_MIN_X=${_MAP_MIN_X}
      - --build-arg
      - NEXT_PUBLIC_MAP_MAX_X=${_MAP_MAX_X}
      - --build-arg
      - NEXT_PUBLIC_MAP_MIN_Y=${_MAP_MIN_Y}
      - --build-arg
      - NEXT_PUBLIC_MAP_MAX_Y=${_MAP_MAX_Y}
      - --build-arg
      - NEXT_PUBLIC_MAP_CENTER_X=${_MAP_CENTER_X}
      - --build-arg
      - NEXT_PUBLIC_MAP_CENTER_Y=${_MAP_CENTER_Y}
      - --build-arg
      - NEXT_PUBLIC_MAP_MAX_ZOOM=${_MAP_MAX_ZOOM}
      - --build-arg
      - NEXT_PUBLIC_ADSENSE_CLIENT=${_ADSENSE_CLIENT}
      - --build-arg
      - NEXT_PUBLIC_ADSENSE_SLOT_BANNER=${_ADSENSE_SLOT_BANNER}
      - --build-arg
      - NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE=${_ADSENSE_SLOT_IN_ARTICLE}
      - --build-arg
      - NEXT_PUBLIC_ADSENSE_UNITS=${_ADSENSE_UNITS}
      - --build-arg
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${_GA_MEASUREMENT_ID}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_AFFILIATE_TAG=${_AMAZON_AFFILIATE_TAG}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_STORE=${_AMAZON_STORE}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_GTA6_PS5=${_AMAZON_ASIN_GTA6_PS5}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_GTA6_XBOX=${_AMAZON_ASIN_GTA6_XBOX}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_GTA6_COLLECTORS_PS5=${_AMAZON_ASIN_GTA6_COLLECTORS_PS5}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_GTA6_COLLECTORS_XBOX=${_AMAZON_ASIN_GTA6_COLLECTORS_XBOX}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_PS5=${_AMAZON_ASIN_PS5}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_XBOX_SERIES_X=${_AMAZON_ASIN_XBOX_SERIES_X}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_DUALSENSE=${_AMAZON_ASIN_DUALSENSE}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_DUALSENSE_WHITE=${_AMAZON_ASIN_DUALSENSE_WHITE}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_XBOX_PAD=${_AMAZON_ASIN_XBOX_PAD}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_DUALSENSE_EDGE=${_AMAZON_ASIN_DUALSENSE_EDGE}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_PULSE_3D=${_AMAZON_ASIN_PULSE_3D}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_ARCTIS_NOVA=${_AMAZON_ASIN_ARCTIS_NOVA}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_SSD_1TB=${_AMAZON_ASIN_SSD_1TB}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_CAPTURE_CARD=${_AMAZON_ASIN_CAPTURE_CARD}
      - --build-arg
      - NEXT_PUBLIC_AMAZON_ASIN_CHARGE_DOCK=${_AMAZON_ASIN_CHARGE_DOCK}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "10"
      - --update-env-vars
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL},NEXT_PUBLIC_CANONICAL_HOST=${_CANONICAL_HOST},NEXT_PUBLIC_GTADB_ENABLED=${_GTADB_ENABLED},NEXT_PUBLIC_GTADB_NATIVE=${_GTADB_NATIVE},NEXT_PUBLIC_GTADB_MAP_IMAGE=${_GTADB_MAP_IMAGE},NEXT_PUBLIC_GTA5_GTADB_ENABLED=${_GTA5_GTADB_ENABLED},NEXT_PUBLIC_GTA5_GTADB_NATIVE=${_GTA5_GTADB_NATIVE},NEXT_PUBLIC_GTA5_GTADB_MAP_IMAGE=${_GTA5_GTADB_MAP_IMAGE},NEXT_PUBLIC_GTA5_MAP_MIN_X=${_GTA5_MAP_MIN_X},NEXT_PUBLIC_GTA5_MAP_MAX_X=${_GTA5_MAP_MAX_X},NEXT_PUBLIC_GTA5_MAP_MIN_Y=${_GTA5_MAP_MIN_Y},NEXT_PUBLIC_GTA5_MAP_MAX_Y=${_GTA5_MAP_MAX_Y},NEXT_PUBLIC_GTA5_MAP_CENTER_X=${_GTA5_MAP_CENTER_X},NEXT_PUBLIC_GTA5_MAP_CENTER_Y=${_GTA5_MAP_CENTER_Y},NEXT_PUBLIC_GTA5_MAP_MAX_ZOOM=${_GTA5_MAP_MAX_ZOOM},NEXT_PUBLIC_VC_MAP_IMAGE=${_VC_MAP_IMAGE},NEXT_PUBLIC_SA_MAP_IMAGE=${_SA_MAP_IMAGE},NEXT_PUBLIC_MAP_MIN_X=${_MAP_MIN_X},NEXT_PUBLIC_MAP_MAX_X=${_MAP_MAX_X},NEXT_PUBLIC_MAP_MIN_Y=${_MAP_MIN_Y},NEXT_PUBLIC_MAP_MAX_Y=${_MAP_MAX_Y},NEXT_PUBLIC_MAP_CENTER_X=${_MAP_CENTER_X},NEXT_PUBLIC_MAP_CENTER_Y=${_MAP_CENTER_Y},NEXT_PUBLIC_MAP_MAX_ZOOM=${_MAP_MAX_ZOOM},NEXT_PUBLIC_GA_MEASUREMENT_ID=${_GA_MEASUREMENT_ID}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
