# Google Cloud Build — Map-6 → Cloud Run
substitutions:
  _REGION: europe-west1
  _SERVICE: map6
  _SITE_URL: https://map-6.com
  _CANONICAL_HOST: map-6.com
  _GTADB_ENABLED: "true"
  _GTADB_NATIVE: "false"
  _GTADB_MAP_IMAGE: /tiles/leonida-stitched.jpg
  _GTA5_GTADB_ENABLED: "true"
  _GTA5_GTADB_NATIVE: "false"
  _GTA5_GTADB_MAP_IMAGE: /tiles/los-santos-stitched.jpg
  _GTA5_MAP_MIN_X: "-4224"
  _GTA5_MAP_MAX_X: "4992"
  _GTA5_MAP_MIN_Y: "-5120"
  _GTA5_MAP_MAX_Y: "8448"
  _GTA5_MAP_CENTER_X: "-75"
